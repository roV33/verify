   <!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#06111f">
<title>Access all script</title>
<style>
/* ===== Desain dark cyan (mobile-first) ===== */
:root{--cy:#00d9e8;--cy2:#00cfe8;--tx:#f1f7fb;--mu:#8aa0b5;--line:rgba(0,217,232,.22);color-scheme:dark}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{min-height:100vh;padding:20px 14px 44px;color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
 background:radial-gradient(900px 420px at 50% -140px,rgba(0,217,232,.17),transparent 70%),linear-gradient(180deg,#07152b,#050c18) fixed}
.wrap{max-width:560px;margin:0 auto} /* satu kartu Taks */
svg.i{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* Header utama (hanya satu) */
.top{display:flex;align-items:center;gap:14px;margin:8px 0 22px}
.logo{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;font-size:28px;color:var(--cy);
 background:rgba(0,217,232,.08);border:1px solid var(--line);box-shadow:0 0 26px rgba(0,217,232,.2)}
.top h1{font-size:32px;line-height:1;letter-spacing:.02em}
.top p{color:var(--mu);margin-top:5px}

/* Kartu */
.card{padding:18px;border-radius:22px;border:1px solid var(--line);background:linear-gradient(160deg,#0d2238,#0a1727);
 box-shadow:0 10px 32px rgba(0,207,232,.07);transition:transform .25s,box-shadow .25s,border-color .25s}
.card:hover{transform:translateY(-2px);border-color:rgba(0,217,232,.45);box-shadow:0 14px 38px rgba(0,207,232,.16)}
.ch{display:flex;align-items:center;gap:12px}
.ch .ico{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;font-size:21px;color:var(--cy);background:rgba(0,217,232,.08);border:1px solid var(--line)}
.nm{flex:1;min-width:0}.nm b{display:block;font-size:18px}.nm small{color:var(--mu)}
.tag{display:inline-flex;gap:5px;align-items:center;font-size:12px;color:var(--cy);border:1px solid var(--line);border-radius:99px;padding:4px 10px;background:rgba(0,217,232,.06)}
.hint{color:var(--mu);margin:14px 0 12px;font-size:14px}

/* Daftar tugas */
.tasks{list-style:none;padding:0;display:grid;gap:9px}
.task{position:relative;overflow:hidden;display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:14px;
 background:rgba(255,255,255,.03);border:1px solid rgba(0,217,232,.14);transition:border-color .2s,background .2s}
.t-ico{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-size:19px;color:var(--cy);background:rgba(0,217,232,.08)}
.t-tx{flex:1;min-width:0}.t-tx b{display:block;font-size:15px}.t-tx small{display:block;color:var(--mu);font-size:12.5px}
.st{font-size:12px;color:var(--mu)}
.task.run{border-color:rgba(0,217,232,.5)}.task.run .st{color:var(--cy2)}
.task.done{background:rgba(0,217,232,.07)}.task.done .st{color:var(--cy)}
.fill{position:absolute;left:0;bottom:0;height:2px;width:0;background:var(--cy);transition:width .25s linear}
.go{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;font-size:20px;color:var(--cy);text-decoration:none;
 border:1px solid var(--line);transition:background .2s,transform .15s}
.go:hover{background:rgba(0,217,232,.12)}.go:active{transform:scale(.92)}
.go:focus-visible,.cont:focus-visible{outline:2px solid var(--cy);outline-offset:2px}
.go .ck{display:none}
.done .go{background:var(--cy);border-color:var(--cy);color:#04202a;pointer-events:none}
.done .go .ar{display:none}.done .go .ck{display:block}

/* Progres */
.pg{margin-top:16px}
.pg-h{display:flex;justify-content:space-between;font-size:12px;letter-spacing:.08em;color:var(--mu)}
.pg-h b{color:var(--cy)}
.bar{height:8px;margin-top:8px;border-radius:9px;background:rgba(255,255,255,.07);overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:9px;background:linear-gradient(90deg,var(--cy2),#5ff3ff);box-shadow:0 0 12px rgba(0,217,232,.6);transition:width .4s ease}

/* Tombol Continue */
.cont{width:100%;margin-top:14px;padding:14px;border-radius:14px;border:1px solid rgba(255,255,255,.08);font:inherit;font-weight:600;
 color:#5d7186;background:rgba(255,255,255,.05);cursor:not-allowed;transition:transform .15s,box-shadow .25s}
.cont:not(:disabled){color:#032029;background:var(--cy);border-color:var(--cy);cursor:pointer;box-shadow:0 8px 24px rgba(0,217,232,.35)}
.cont:not(:disabled):active{transform:scale(.98)}

/* Peringatan (toast) */
.toast{position:fixed;left:50%;bottom:22px;max-width:calc(100% - 28px);padding:12px 16px;border-radius:12px;font-size:14px;color:var(--tx);
 background:#0d2a3d;border:1px solid var(--cy);opacity:0;transform:translate(-50%,20px);pointer-events:none;transition:opacity .25s,transform .25s}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<!-- Sprite ikon outline (inline SVG, tanpa emoji) -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
 <symbol id="lock" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></symbol>
 <symbol id="play" viewBox="0 0 24 24"><path d="M7 4.5v15l12-7.5z"/></symbol>
 <symbol id="yt" viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="4.5"/><path d="M10 9.2v5.6l4.8-2.8z"/></symbol>
 <symbol id="like" viewBox="0 0 24 24"><path d="M7 10v12"/><path d="M15 5.9 14 10h5.8a2 2 0 0 1 1.9 2.6l-2.3 8a2 2 0 0 1-1.9 1.4H4a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2h2.8a2 2 0 0 0 1.8-1.1L12 2a3.1 3.1 0 0 1 3 3.9z"/></symbol>
 <symbol id="arrow" viewBox="0 0 24 24"><path d="M7 7h10v10"/><path d="M7 17 17 7"/></symbol>
 <symbol id="check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>
</svg>

<div class="wrap">
 <!-- Header utama: hanya muncul satu kali -->
 <header class="top">
  <span class="logo"><svg class="i"><use href="#lock"/></svg></span>
  <div><h1>verify</h1><p>akses menuju script</p></div>
 </header>
 <main class="grid" id="grid"></main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* =====================================================================
   KONFIGURASI  (EDIT BAGIAN INI)
   ---------------------------------------------------------------------
   Hanya ada SATU kartu "Taks" berisi 5 tugas dalam satu daftar:
   - taskSeconds : lama timer tiap tugas (detik).
   - name        : nama kartu yang ditampilkan.
   - tasks       : 5 URL YouTube, berurutan:
                   Like Video 1, 2, 3, 4, lalu Subscribe (URL channel).
   - destination : satu URL tujuan tombol "Continue to Executor".
   ** GANTI semua URL contoh di bawah dengan URL milik Anda. **
   URL harus diawali http:// atau https://. Jika dikosongkan (""),
   website menampilkan peringatan saat tugas/tombol itu ditekan.
   ===================================================================== */
const CONFIG = {
  taskSeconds: 10,
  name: "Taks",
  tasks: [
    "https://www.youtube.com/watch?v=jNQXAC9IVRw", // Like Video 1  <- GANTI
    "https://www.youtube.com/watch?v=dQw4w9WgXcQ", // Like Video 2  <- GANTI
    "https://www.youtube.com/watch?v=9bZkp7q19f0", // Like Video 3  <- GANTI
    "https://www.youtube.com/watch?v=kJQP7kiw5Fk", // Like Video 4  <- GANTI
    "https://www.youtube.com/@YouTube"             // Subscribe     <- GANTI
  ],
  destination: "https://youtube.com/@colz-hub?si=4DMp1XS86MD_pFyw"      // URL Executor  <- GANTI
};

/* =====================================================================
   BATASAN KEAMANAN (baca ini)
   Timer HANYA mengukur waktu yang berlalu sejak tautan ditekan. Timer
   TIDAK dapat membuktikan bahwa pengguna benar-benar menonton video,
   memberi Like, atau Subscribe. Website statis ini BUKAN sistem
   verifikasi yang aman: progres di localStorage bisa diubah siapa pun
   lewat developer tools. Website ini tidak meminta password YouTube
   atau token akun apa pun.
   ===================================================================== */

const N = 5;                              // jumlah tugas dalam kartu
const LIMIT = CONFIG.taskSeconds * 1000;  // durasi timer (ms)
const KEY = "taksAccess.v2.taks";         // kunci localStorage (satu kartu, satu progres bersama)
const $ = (s, r = document) => r.querySelector(s);
const ic = (n, c = "") => `<svg class="i ${c}" aria-hidden="true"><use href="#${n}"/></svg>`;
const isUrl = u => /^https?:\/\/\S+$/i.test(String(u || "").trim());

/* ---------- Penyimpanan: progres dimulai dari nol pada instalasi baru ---------- */
// start[i] = waktu mulai (ms, Date.now()), bukan angka hitung mundur,
// sehingga timer tetap akurat saat tab pindah / browser di latar belakang.
function load() {
  try {
    const v = JSON.parse(localStorage.getItem(KEY));
    if (v && v.done && v.start && v.done.length === N && v.start.length === N) return v;
  } catch (e) { /* storage tidak tersedia: pakai memori */ }
  return { done: Array(N).fill(false), start: Array(N).fill(null), left: false };
}
const S = load();
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
}

/* ---------- Reset otomatis setelah Continue ----------
   Saat Continue ditekan, S.left diset true dan disimpan SEBELUM pindah ke executor.
   Ketika pengguna kembali, S.left yang masih true berarti "sudah pernah Continue",
   maka seluruh progres dikosongkan. Penanda ini ada di localStorage sekaligus di memori
   halaman, jadi reset bekerja untuk muat ulang biasa, tombol Back, dan halaman yang
   dipulihkan dari Back/Forward Cache (pageshow). Progres yang belum Continue tidak disentuh. */
function checkReturn() {
  if (!S.left) return false;
  S.done.fill(false); S.start.fill(null); S.left = false;
  save();
  return true;
}

/* ---------- Membangun kartu Taks (5 tugas dalam satu daftar) ---------- */
const taskHtml = i => `
 <li class="task">
  <span class="t-ico">${ic(i < 4 ? "like" : "yt")}</span>
  <div class="t-tx"><b>${i < 4 ? "Like Video " + (i + 1) : "Subscribe"}</b>
   <small>Step ${i + 1} · YouTube</small><span class="st">Belum dimulai</span></div>
  <a class="go" href="#" target="_blank" rel="noopener noreferrer" data-i="${i}"
     aria-label="Buka tautan ${i < 4 ? "Like Video " + (i + 1) : "Subscribe"}">${ic("arrow", "ar")}${ic("check", "ck")}</a>
  <i class="fill"></i>
 </li>`;

function build() {
  const el = document.createElement("section");
  el.className = "card"; el.id = "card";
  el.innerHTML = `
   <div class="ch"><span class="ico">${ic("lock")}</span>
    <div class="nm"><b></b><small>akses web</small></div>
    <span class="tag">${ic("play")}YouTube</span></div>
   <p class="hint">Complete the steps below to continue to the web</p>
   <ul class="tasks">${[0, 1, 2, 3, 4].map(taskHtml).join("")}</ul>
   <div class="pg"><div class="pg-h"><span>YOUR PROGRESS</span><b class="cnt">0 OF 5</b></div>
    <div class="bar"><i></i></div></div>
   <button class="cont" type="button" disabled>Continue to Executor →</button>`;
  $(".nm b", el).textContent = CONFIG.name;
  // URL dipasang lewat properti (aman dari karakter khusus). Tautan <a> asli
  // dipakai agar tab baru terbuka andal di browser Android.
  el.querySelectorAll("a.go").forEach((a, i) => { if (isUrl(CONFIG.tasks[i])) a.href = CONFIG.tasks[i].trim(); });
  $("#grid").appendChild(el);
}

/* ---------- Render kartu dari state-nya ---------- */
function render(now) {
  const el = $("#card"); let n = 0;
  el.querySelectorAll(".task").forEach((t, i) => {
    let cls = "task", txt = "Belum dimulai", w = 0;
    if (S.done[i]) { cls += " done"; txt = "Selesai"; w = 100; n++; }
    else if (S.start[i]) {
      const e = now - S.start[i];
      cls += " run"; txt = `Timer berjalan · ${Math.max(1, Math.ceil((LIMIT - e) / 1000))} dtk`; w = e / LIMIT * 100;
    }
    t.className = cls; $(".st", t).textContent = txt; $(".fill", t).style.width = w + "%";
  });
  $(".cnt", el).textContent = `${n} OF ${N}`;
  $(".bar i", el).style.width = (n / N * 100) + "%";
  $(".cont", el).disabled = n < N;   // aktif hanya jika kelima tugas selesai
}

/* ---------- Timer: dihitung dari waktu mulai, bukan dari counter ---------- */
function tick() {
  const now = Date.now(); let changed = false;
  for (let i = 0; i < N; i++) {
    if (S.done[i] || !S.start[i]) continue;
    let e = now - S.start[i];
    if (e < 0) { S.start[i] = now; e = 0; changed = true; }          // jam perangkat diubah mundur
    if (e >= LIMIT) { S.done[i] = true; S.start[i] = null; changed = true; } // selesai otomatis
  }
  if (changed) save();
  render(now);
}

/* ---------- Peringatan singkat ---------- */
let tt;
function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.classList.add("on");
  clearTimeout(tt); tt = setTimeout(() => t.classList.remove("on"), 4200);
}

/* ---------- Interaksi ---------- */
$("#grid").addEventListener("click", e => {
  const a = e.target.closest("a.go");
  if (a) {                                   // panah tugas
    const i = +a.dataset.i;
    if (S.done[i]) return e.preventDefault();
    if (!isUrl(CONFIG.tasks[i])) {           // URL belum diisi -> jangan mulai timer
      e.preventDefault();
      return toast(`URL Step ${i + 1} belum diisi. Edit bagian KONFIGURASI di index.html.`);
    }
    if (!S.start[i]) { S.start[i] = Date.now(); save(); }  // timer mulai; tab baru dibuka oleh <a>
    return tick();
  }
  const b = e.target.closest("button.cont");
  if (b && !b.disabled) {                    // tombol Continue
    if (!isUrl(CONFIG.destination)) return toast("URL tujuan Executor belum diisi. Edit bagian KONFIGURASI di index.html.");
    S.left = true; save();                   // tandai: pengguna pergi ke executor (reset saat kembali)
    location.href = CONFIG.destination.trim();
  }
});

// Saat halaman kembali terlihat / dipulihkan: reset bila pengguna baru dari executor, lalu perbarui tampilan
document.addEventListener("visibilitychange", () => { if (!document.hidden) checkReturn(); tick(); });
window.addEventListener("focus", tick);
window.addEventListener("pageshow", () => { checkReturn(); tick(); }); // termasuk pemulihan dari bfcache
setInterval(tick, 250);

checkReturn();   // muat ulang biasa / Back tanpa bfcache: progres lama dibersihkan sebelum tampil
build();
tick();
</script>
</body>
</html>
